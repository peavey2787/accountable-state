name: Rust PoC validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Reproducible release validation: exactly the committed Cargo.lock.
  locked:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
      - uses: taiki-e/install-action@cargo-audit
      - name: Security audit
        run: cargo audit
      - name: Cargo format (read-only)
        run: cargo fmt --all -- --check
      - name: Cargo lint (no warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent cryptographic/codec checks
        run: |
          node scripts/verify-vectors.mjs
          node scripts/verify-event-codec.mjs
          node scripts/bench-packing.mjs
  # Compatibility with the newest p2p-net main; never changes the committed lockfile.
  newest-main:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Newest p2p-net main
        if: runner.os != 'Windows'
        run: sh scripts/newest-main-compat.sh
      - name: Newest p2p-net main
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts
ewest-main-compat.cmd
