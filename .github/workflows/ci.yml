name: Rust PoC validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Reproducible release validation: exactly the committed Cargo.lock.
  locked:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
      - uses: taiki-e/install-action@cargo-audit
      - name: Security audit
        run: cargo audit
      - name: Cargo format (read-only)
        run: cargo fmt --all -- --check
      - name: Cargo lint (no warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent cryptographic/codec checks
        run: |
          node scripts/verify-vectors.mjs
          node scripts/verify-event-codec.mjs
          node scripts/bench-packing.mjs
  # Compatibility with the newest p2p-net main; never changes the committed lockfile.
  newest-main:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Newest p2p-net main
        if: runner.os != 'Windows'
        run: sh scripts/newest-main-compat.sh
      - name: Newest p2p-net main
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\newest-main-compat.cmd
  # Supplemental release gates, each a required job of its own so a missing tool is a failure.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo install wasm-pack --locked
      - run: cargo clippy -p gv-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: wasm-pack test --node
        working-directory: adapters/wasm
  capi-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: .NET P/Invoke host
        if: runner.os != 'Windows'
        run: sh scripts/capi-dotnet-smoke.sh
      - name: .NET P/Invoke host
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\capi-dotnet-smoke.cmd
      - name: C client (warnings as errors)
        if: runner.os != 'Windows'
        run: sh scripts/capi-c-smoke.sh
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: sh scripts/tsan-linux.sh
