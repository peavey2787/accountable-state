[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sig",
    "crates/codec",
    "crates/edge",
    "crates/commitments",
    "crates/transcript",
    "crates/replay",
    "crates/privacy",
    "crates/zk",
    "crates/zk-private",
    "crates/proof-queue",
    "crates/accountable-state",
    "adapters/p2p",
    "adapters/wasm",
    "adapters/c",
    "examples/movement",
    "examples/packed-match"
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"
license = "GPL-2.0-or-later"

[workspace.dependencies]
sha2 = "0.10"

# Hydra's password KDF takes ~45s per store open in an unoptimized build, which
# starves native handshake timeouts in tests. Optimize third-party crates
# only; workspace crates keep fast debug builds and debug assertions.
[profile.dev.package."*"]
opt-level = 3

# webrtc 0.17 pulls dtls 0.17.2 -> crypto-bigint 0.5.5 (RUSTSEC-2026-0387); p2p-net carries a fixed dtls.
[patch.crates-io]
dtls = { git = "https://github.com/peavey2787/p2p-net" }
