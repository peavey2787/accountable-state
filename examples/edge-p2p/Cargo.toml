[package]
name = "gv-edge-p2p-demo"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true

[dependencies]
gv-edge = { path = "../../crates/edge" }
gv-core = { path = "../../crates/core" }
gv-codec = { path = "../../crates/codec" }
gv-commitments = { path = "../../crates/commitments" }
gv-replay = { path = "../../crates/replay" }
gv-p2p = { path = "../../adapters/p2p", features = ["native"] }
gv-sig = { path = "../../crates/sig" }
hydra-msg = { git = "https://github.com/peavey2787/hydra-msg" }
p2p-net = { git = "https://github.com/peavey2787/p2p-net", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
