[package]
name = "gv-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# In-memory trust store for tests and simulations only (no crash/rollback protection).
ephemeral-store = []
# Generic deterministic test state machine (protocol tests, fuzzing, SDK examples).
testkit = []

[dependencies]
gv-core = { path = "../core" }
gv-codec = { path = "../codec" }
gv-commitments = { path = "../commitments" }
gv-replay = { path = "../replay" }
gv-sig = { path = "../sig" }
sha2 = { workspace = true }
