[package]
name = "gv-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-or-later"
description = "Browser / Web Worker bindings for the accountable-state proof queue."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gv-proof-queue = { path = "../../crates/proof-queue" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
gv-codec = { path = "../../crates/codec" }
gv-sig = { path = "../../crates/sig" }
wasm-bindgen-test = "0.3"
